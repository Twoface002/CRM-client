<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demo Accounts</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    *{
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }
    .main-content {
      font-family: Arial, sans-serif;
      color: rgb(0, 0, 0);
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .btn {
      background:linear-gradient(360deg, rgb(247, 169, 0),rgb(252, 254, 124));
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }
    .btn:hover{
      background: linear-gradient(rgb(249, 239, 127));
    }

    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      /* height: 100%; */
      overflow: auto;
    }

    .modal-content {
      background-color: #ffffff;
      margin: 10% auto;
      padding: 20px;
      border: 1px solid #333;
      width: 400px;
      border-radius: 10px;
      position: relative;
    }

    .modal-content h2 {
      color: rgb(216, 136, 6);
      margin-bottom: 15px;
    }
    .close {
      color: #aaa;
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 28px;
      cursor: pointer;
    }

    h2 {
       margin-top: 0;
    }

    .title{
       color: white;
       padding-top: 10px;
       display: flex;
       justify-content: center;
    }
    .subtitle {
      color: gray;
      margin-bottom: 20px;
     font-size: 14px;
    }

label {
  display: block;
  margin-top: 15px;
  font-weight: bold;
}

.required {
  color: red;
}

input, select {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  box-sizing: border-box;
  border-radius: 4px;
  border: 1px solid #ccc;
}

.password-field {
  position: relative;
}

.toggle-password {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
}

.buttons {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 20px;
}
.create {
  background-color: #fabb00;
  color: white;
  border: none;
  padding: 10px 15px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}
.create:hover {
  background-color: #b79707;
}
.cancel {
  background-color: rgb(216, 215, 215);
  border: 1px solid #ccc;
  padding: 10px 15px;
  border-radius: 4px;
  cursor: pointer;
  font-weight: bold;
}
.cancel:hover {
  background-color: #eee;
}


.top-button {
  display: flex;
  justify-content: space-between;
  width: 100%;
  margin-bottom: 20px;
}

.left-btn, .right-btn {
  flex: 1;
  text-align: center;
}

.left-btn {
  margin-right: 15px;
}

.right-btn {
  margin-left: 15px;
}

@media (max-width: 600px) {
  .top-button {
    flex-direction: column;
    align-items: center;
  }
  .left-btn, .right-btn {
    width: 100%;
    margin: 5px 0;
  }
}
 /* Demo opening Accounts css codes here */
#demo-side-title{
  color: greenyellow;
  padding: 2%;
}
.demo-open-dtl{
  width: 50%;
  display: grid;
  flex-direction: column;
  background-color: #1e1e1e;  
  border-left: 5px solid limegreen;
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 0 10px rgba(0,0,0,0.5);
  color: #fff;
}

.demo-dtl {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.account-name {
  color: #00aaff;
  font-weight: bold;
}

.demo {
  color: #007bff;
}

.account-id {
  font-size: 14px;
  color: #ccc;
}

.balance-info {
  text-align: right;
  font-size: 14px;
}

.input-group {
  background: #2c2c2c;
  display: flex;
  align-items: center;
  border-radius: 8px;
  margin-bottom: 15px;
  padding: 5px 10px;
}

.input-icon {
  font-size: 20px;
  margin-right: 10px;
}

input[type="text"],
input[type="number"] {
  background: transparent;
  border: none;
  color: #fff;
  background: #2c2c2c;
  flex: 1;
  outline: none;
  font-size: 16px;
}

.check-leverage,.check-balance {
  color: limegreen;
  font-size: 18px;
  cursor: pointer;  
}

.check-icon:hover {
  transform: scale(1.1);
}
@media (max-width: 600px) {
  .demo-open-dtl {
    flex-direction: column;
    align-items: center;
    width: 100%;
    margin: 5px 0;
  }
}


  </style>
  </head>
  <body>
    <div class="main-content">
      <div class="title">
        <h2 id="titl">Explore Demo Account</h2><br>
      </div>
      <div class="top-button">

          <button class="btn" onclick="openModal()">Open New demo account</button>
          <a href="./trading_account.html"><button class="btn">Go Live Account</button></a>

      </div>

      <!-- Demo opening Accounts html codes here -->
      <h4 id="demo-side-title">Demo Accounts</h4>
      <div class="demo-open-dtl">
        <div class="demo-dtl">
          <div>
            <span class="account-name">Holder Name - <span class="demo">Demo</span></span><br>
            <span class="account-id">Account ID: <strong>number</strong></span>
          </div>
          <div class="balance-info">
            <div>Balance:$ <strong>amount</strong></div>
            <div>Leverage: <strong>level</strong></div>
          </div>
        </div>

        <div class="inputs">
          <div class="input-group">
            <div class="input-icon">
              💲
            </div>
            <input type="number" id="balanceInput" placeholder="Current: ">
            <div class="check-balance" title="Apply Balance">
              ✅
            </div>
          </div>
          <div class="input-group">
            <div class="input-icon">
              📈
            </div>
            <label for="leverageInput"></label>
            <select id="leverageInput"  required>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="5">5</option>
              <option value="10">10</option>
              <option value="20">20</option>
              <option value="50">50</option>
              <option value="100">100</option>
              <option value="200">200</option>
              <option value="500">500</option>
              <option value="1000">1000</option>
            </select>
            <div class="check-leverage" title="Apply Leverage">
              ✅
            </div>
          </div>
        </div>
      </div>

      <div id="accountModal" class="modal">
        <div class="modal-content">
          <span class="close" onclick="closeModal()">&times;</span>
          <h2>Create Demo Account</h2>
          <p class="subtitle">Set up a <strong>free demo account</strong> to explore trading without risks.</p>
          <form id="demoAccountForm">
            <label for="balance">Initial Balance <span class="required">*</span></label>
            <input type="number" id="balance" name="balance" placeholder="Enter balance (USD)" required>
    
            <label for="leverage">Leverage <span class="required">*</span></label>
            <select id="leverage" name="leverage" required>
              <option value="1x">1x</option>
              <option value="2x">2x</option>
              <option value="5x">5x</option>
              <option value="10x">10x</option>
              <option value="20x">20x</option>
              <option value="50x">50x</option>
              <option value="100x">100x</option>
              <option value="200x">200x</option>
              <option value="500x">500x</option>
              <option value="1000x">1000x</option>
            </select>
    
            <label for="masterPassword">Master Password <span class="required">*</span></label>
            <div class="password-field">
                <input type="password" id="masterPassword" name="masterPassword" placeholder="Enter master password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('masterPassword')">👁️</button>
            </div>
    
            <label for="investorPassword">Investor Password <span class="required">*</span></label>
            <div class="password-field">
                <input type="password" id="investorPassword" name="investorPassword" placeholder="Enter investor password" required>
                <button type="button" class="toggle-password" onclick="togglePassword('investorPassword')">👁️</button>
            </div>
    
            <div class="buttons">
                <!-- <button type="button" class="cancel" onclick="cancelForm()">Cancel</button> -->
                <button type="button" class="cancel" onclick="closeModal()">Cancel</button>
                <button type="submit" class="create">Create Account</button>
            </div>
        </form>
        </div>
      </div>
    </div>


    <script>
      const modal = document.getElementById("accountModal");
      function openModal() {
        modal.style.display = "block";
      }
      function closeModal() {
        modal.style.display = "none";
      }
      function togglePassword(fieldId) {
        const field = document.getElementById(fieldId);
        field.type = (field.type === "password") ? "text" : "password";
      }
      
      // Close modal if clicking outside
      modal.addEventListener("click", function (event) {
        if (event.target === modal) {
          closeModal();
        }
      });
      
      // Handle demo account form submission
      document.getElementById("demoAccountForm").addEventListener("submit", function(event) {
        event.preventDefault();
        
        // Get form values
        const balance = document.getElementById("balance").value;
        const leverage = document.getElementById("leverage").value;
        
        // Generate a random Account ID (you can replace this with a real value)
        const accountId = Math.floor(Math.random() * 900000) + 100000; // 6 digit random number
        
        // Create a new account block
        const accountDiv = document.createElement("div");
        accountDiv.className = "demo-open-dtl";
        accountDiv.innerHTML = `
          <div class="demo-dtl">
            <div>
              <span class="account-name">Holder Name - <span class="demo">Demo</span></span><br>
              <span class="account-id">Account ID: <strong>${accountId}</strong></span>
            </div>
            <div class="balance-info">
              <div>Balance: $<strong>${balance}</strong></div>
              <div>Leverage: <strong>${leverage}</strong></div>
            </div>
          </div>
      
          <div class="inputs">
            <div class="input-group">
              <div class="input-icon">
                💲
              </div>
              <input type="number" placeholder="Current: ${balance}">
              <div class="check-balance" title="Apply Balance">
                ✅
              </div>
            </div>
            <div class="input-group">
              <div class="input-icon">
                📈
              </div>
              <select required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="5">5</option>
                <option value="10">10</option>
                <option value="20">20</option>
                <option value="50">50</option>
                <option value="100">100</option>
                <option value="200">200</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
              </select>
              <div class="check-leverage" title="Apply Leverage">
                ✅
              </div>
            </div>
          </div>
        `;
      
        // Append it after the last account
        document.getElementById("demo-side-title").after(accountDiv);
      
        // Close the modal
        closeModal();
      
        // Reset the form
        document.getElementById("demoAccountForm").reset();
      
        // Re-attach click listeners for ✅ buttons inside new account
        attachCheckListeners();
      });
      
      // Attach click listeners for Balance and Leverage ✅ buttons
      function attachCheckListeners() {
        const balanceChecks = document.querySelectorAll('.check-balance');
        const leverageChecks = document.querySelectorAll('.check-leverage');
      
        balanceChecks.forEach((btn) => {
          btn.onclick = () => alert('Balance Applied Successfully!');
        });
      
        leverageChecks.forEach((btn) => {
          btn.onclick = () => alert('Leverage Applied Successfully!');
        });
      }
      
      // Initial attach
      attachCheckListeners();
      </script>
      

</body>
</html>
